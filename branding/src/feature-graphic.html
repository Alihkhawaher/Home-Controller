<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home Controller feature graphic</title>
<style>
  :root { --navy: #0E3A4F; --white: #FFFFFF; --cyan: #5CE1E6; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: var(--navy); }
  body { position: relative; font-family: "Poppins", "Segoe UI", system-ui, sans-serif; color: var(--white); }
  .hub { position: absolute; left: 548px; top: -10px; width: 520px; height: 520px; }
  .copy { position: absolute; left: 64px; top: 0; height: 500px; width: 520px;
          display: flex; flex-direction: column; justify-content: center; }
  .icon { width: 84px; height: 84px; margin-bottom: 26px; border-radius: 23.6%; box-shadow: 0 0 0 2px #2C6E80; }
  h1 { margin: 0; font-size: 56px; line-height: 1.05; font-weight: 600; letter-spacing: -0.4px; }
  .tag { margin: 18px 0 0; font-size: 25px; line-height: 1.45; font-weight: 400; }
  .tag span { color: var(--cyan); font-weight: 500; }
</style>
</head>
<body>
  <img class="hub" src="hub.svg" alt="">
  <div class="copy">
    <img class="icon" src="../icon-rounded.svg" alt="">
    <h1>Home Controller</h1>
    <p class="tag">Your home hub, in your pocket.<br><span>No server. No cloud.</span></p>
  </div>
</body>
</html>
